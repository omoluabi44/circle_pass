# ------------------------------------------------------------
# 1. HTTP Redirect Block (Handles ALL domains)
# ------------------------------------------------------------
server {
    listen 80;
    server_name thecirclepass.com www.thecirclepass.com api.thecirclepass.com;

    # Allow Certbot verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Serve Next.js frontend on /
    location / {
        proxy_pass http://frontend:3000;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve Django backend on /api and /admin
    location ~ ^/(api|admin) {
        proxy_pass http://backend:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
    }
}

