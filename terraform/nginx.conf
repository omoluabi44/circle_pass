# ------------------------------------------------------------
# 0. Default catch-all HTTP block (direct IP access / pre-DNS)
# ------------------------------------------------------------
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Serve frontend directly when accessed by raw IP (before DNS propagates)
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ------------------------------------------------------------
# 1. HTTP → HTTPS Redirect (named domains only)
# ------------------------------------------------------------
server {
    listen 80;
    server_name thecirclepass.com www.thecirclepass.com api.thecirclepass.com;

    # Allow Certbot verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------
# 2. Main Site Block (Next.js Frontend)
# ------------------------------------------------------------
server {
    listen 443 ssl;
    server_name thecirclepass.com www.thecirclepass.com;

    ssl_certificate /etc/letsencrypt/live/thecirclepass.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thecirclepass.com/privkey.pem;

    location / {
        proxy_pass http://frontend:3000;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket Support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ------------------------------------------------------------
# 3. API Subdomain Block (Django Backend)
# ------------------------------------------------------------
server {
    listen 443 ssl;
    server_name api.thecirclepass.com;

    ssl_certificate /etc/letsencrypt/live/thecirclepass.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thecirclepass.com/privkey.pem;

    location / {
        proxy_pass http://backend:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket Support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # File Upload Limit
        client_max_body_size 50M;
    }
}
