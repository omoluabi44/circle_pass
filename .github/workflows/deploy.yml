name: CirclePass Deployment

on:
  push:
    branches:
      - main

jobs:
  build-and-push-frontend:
    name: Build & Push Frontend Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: omoluabi44/circlepass-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.thecirclepass.com/api

  build-and-push-backend:
    name: Build & Push Backend Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: omoluabi44/circlepass-backend:latest

  deploy-ec2:
    name: Deploy to EC2
    needs: [build-and-push-frontend, build-and-push-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_IP }}
          username: ${{ secrets.EC2_USERNAME || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            if [ ! -d "~/circlepass" ]; then
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git ~/circlepass
            fi
            cd ~/circlepass
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git fetch --all
            git reset --hard origin/main
            
            # Setup env file
            if [ ! -f .env ]; then
              touch .env
            fi
            if [ ! -s backend/.env ]; then echo "${{ secrets.BACKEND_ENV_FILE }}" > backend/.env; fi
            
            # Ensure verified Let's Encrypt certificates exist; restore from backup if needed
            mkdir -p certbot/conf certbot/www
            if [ ! -f certbot/conf/live/thecirclepass.com/fullchain.pem ] && [ -d /home/ubuntu/certbot_backup ]; then
              sudo cp -r /home/ubuntu/certbot_backup/* certbot/ || true
            fi
            
            # Stop any pre-existing host web servers blocking port 80
            sudo systemctl stop apache2 || true
            sudo systemctl stop nginx || true
            sudo systemctl disable apache2 || true
            sudo systemctl disable nginx || true
            
            # Restart containers
            sudo docker-compose down
            sudo docker image prune -af
            sudo docker-compose pull
            sudo docker-compose up -d
            
            # Run migrations
            sudo docker-compose exec -T backend python manage.py migrate
            
            # Auto-reconcile all unconfirmed Paystack payments and issue tickets
            sudo docker-compose exec -T backend python manage.py reconcile_payments --hours 168
            
            # Renew certificates when due (checks validity automatically)
            sudo docker-compose run --rm certbot renew --webroot -w /var/www/certbot --quiet || true
            
            # Keep backup updated and reload nginx
            sudo cp -r certbot/* /home/ubuntu/certbot_backup/ || true
            sudo docker-compose exec -T nginx nginx -s reload || true

